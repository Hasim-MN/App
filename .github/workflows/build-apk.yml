name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Next.js Static Export
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Set Executable Permission on Gradle Wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/MediaFlow-Downloader.apk
          ls -la release-artifacts/

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Downloader-APK
          path: release-artifacts/MediaFlow-Downloader.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Rolling Release (Main branch push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: MediaFlow Downloader (Latest APK Build)
          draft: false
          prerelease: false
          files: release-artifacts/MediaFlow-Downloader.apk
          body: |
            ## 📱 MediaFlow Downloader Android App

            ### ⬇️ Direct APK Download
            Download the Android application package below:
            - **[Download MediaFlow-Downloader.apk](https://github.com/${{ github.repository }}/releases/download/latest/MediaFlow-Downloader.apk)**

            ---

            ### 📲 Installation Instructions:
            1. Download the `.apk` file above onto your Android phone.
            2. Tap the file and select **Install** (allow *Install unknown apps* if prompted).
            3. Open **MediaFlow Downloader**.
            4. In the top header bar, tap the **Server** icon to enter your backend server URL (e.g. `http://192.168.x.x:8000` when connected to your home Wi-Fi, or your hosted cloud URL), then tap **Save & Connect**.

      - name: Publish Tagged Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-artifacts/MediaFlow-Downloader.apk
          name: MediaFlow Downloader ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 MediaFlow Downloader Android Release ${{ github.ref_name }}

            ### ⬇️ Direct Download
            - **[Download MediaFlow-Downloader.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MediaFlow-Downloader.apk)**

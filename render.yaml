services:
  - type: web
    name: mediaflow-backend
    env: python
    buildCommand: "curl -fsSL https://deno.land/install.sh | sh && pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "export PATH=\"$HOME/.deno/bin:$PATH\" && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: YOUTUBE_COOKIES
        sync: false

